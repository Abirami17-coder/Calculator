<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator (Month Based)</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

    <style>
         .navbar-nav .nav-link {
    position: relative;
    transition: color 0.3s;
}

.navbar-nav .nav-link:hover::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    background-color: white;
    left: 0;
    bottom: 0;
    transition: width 0.3s;
}

.navbar-nav .nav-link:hover {
    color:  white  !important;
}
        section {
            background: linear-gradient(90deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-label {
            font-weight: 600;
        }

        .result-box {
            background-color: #fff8f0;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background: linear-gradient(90deg, #0ae64c 0%, #dab10d 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3 text-white" href="#">
                <img src="https://img.icons8.com/color/48/calculator.png" alt="Logo" width="35" class="me-2">
                Calculator
            </a>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-white active" href="24.html">GST Calculator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-white" href="26.html">Interest Calculator</a>
                    </li>
       
                </ul>
            </div>
        </div>
    </nav>
    <section>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="text-center mb-4 text-danger">Interest Calculator (Month Based)</h3>

                <form id="interestForm">
                    <div class="mb-3">
                        <label class="form-label">Principal Amount (₹)</label>
                        <input type="number" id="principal" class="form-control" placeholder="Enter Principal Amount" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rate of Interest (%) per Annum</label>
                        <input type="number" id="rate" class="form-control" placeholder="Enter Rate" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Time (Months)</label>
                        <input type="number" id="months" class="form-control" placeholder="Enter Time in Months" required>
                    </div>

                    <div class="text-center">
                        <button type="button" onclick="calculateInterest()" class="btn btn-danger px-4">Calculate</button>
                    </div>

                    <div class="mt-4 result-box">
                        <p>Simple Interest: <span id="interestResult">0.00</span></p>
                        <p>Total Amount: <span id="totalAmount">0.00</span></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</section>
<script>
    function calculateInterest() {
        let principal = parseFloat(document.getElementById('principal').value) || 0;
        let rate = parseFloat(document.getElementById('rate').value) || 0;
        let months = parseFloat(document.getElementById('months').value) || 0;

        let interest = (principal * rate * months) / (100 * 12);
        let total = principal + interest;

        document.getElementById('interestResult').innerText = interest.toFixed(2);
        document.getElementById('totalAmount').innerText = total.toFixed(2);
    }
</script>

</body>
</html>

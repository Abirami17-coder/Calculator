<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<style>
        .navbar-nav .nav-link {
    position: relative;
    transition: color 0.3s;
}

.navbar-nav .nav-link:hover::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    background-color: white;
    left: 0;
    bottom: 0;
    transition: width 0.3s;
}

.navbar-nav .nav-link:hover {
    color: white !important;
}
section {
            background: linear-gradient(90deg, #74ebd5 0%, #bfe5ac 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .form-label {
            font-weight: bold;
        }
        .result-box {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background: linear-gradient(90deg, #0ae64c 0%, #dab10d 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-3 text-white" href="#">
                <img src="https://img.icons8.com/color/48/calculator.png" alt="Logo" width="35" class="me-2">
                Calculator
            </a>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-white active" href="24.html">GST Calculator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-white" href="26.html">Interest Calculator</a>
                    </li>
       
                </ul>
            </div>
        </div>
    </nav>
<section>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="text-center mb-4 text-info">GST Calculator</h3>
    
                    <!-- Form Row -->
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" id="price" class="form-control" placeholder="Enter Price">
                        </div>
    
                        <div class="col-md-4">
                            <label class="form-label">Qty (UI)</label>
                            <input type="number" id="ui" class="form-control" placeholder="Enter Qty">
                        </div>
    
                        <div class="col-md-4">
                            <label class="form-label">Tax %</label>
                            <input type="number" id="tax" class="form-control" placeholder="Enter Tax %">
                        </div>
                    </div>
    
                    <!-- Calculate Button -->
                    <div class="text-center mt-4">
                        <button onclick="calculateGST()" class="btn btn-success px-4">Calculate</button>
                    </div>
    
                    <!-- Result -->
                    <div class="mt-4 result-box">
                        <p>Sub Total: ₹<span id="subTotal">0.00</span></p>
                        <p>Tax Amount: ₹<span id="taxAmount">0.00</span></p>
                        <p>Final GST Total: ₹<span id="totalGST">0.00</span></p>
                    </div>
    
                </div>
            </div>
        </div>
    </div>
</section>
    <script>
        function calculateGST() {
            let price = parseFloat(document.getElementById('price').value) || 0;
            let ui = parseFloat(document.getElementById('ui').value) || 0;
            let tax = parseFloat(document.getElementById('tax').value) || 0;
    
            let subTotal = price * ui;
            let taxAmount = (subTotal * tax) / 100;
            let totalGST = subTotal + taxAmount;
    
            document.getElementById('subTotal').innerText = subTotal.toFixed(2);
            document.getElementById('taxAmount').innerText = taxAmount.toFixed(2);
            document.getElementById('totalGST').innerText = totalGST.toFixed(2);
        }
    </script>
    

</body>
</html>
